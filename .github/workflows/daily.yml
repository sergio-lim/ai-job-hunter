name: daily

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Live hunt
        run: python -m jobhunter run --live --min-score 60 --json > report.json
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.json
